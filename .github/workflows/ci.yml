name: ci

# Every job checks the two repositories out side by side, because `[tool.uv.sources]` resolves
# `causal-hybrid-control` from the sibling path `../causal-hybrid-control`. The library repo is public,
# so the default `GITHUB_TOKEN` reaches it and no extra secret is involved. `uv run ruff` takes the
# version from this repo's lockfile, so CI and a local run cannot disagree about what counts as
# formatted.
#
# `test` runs at JAX's default float32; `test-x64` re-runs the same suite under `JAX_ENABLE_X64=1`.
# Two independent things make the second job worth its minutes. Track J's claim is *exact* recovery of
# a known control channel, which is a float64 claim -- at float32 its assertions relax to a measured
# noise floor, so only this job gates the seven digits. And a `seed` identifies a synthetic dataset
# only at a fixed dtype: `jax.random` spends a different number of threefry bits per element for a
# float64 output than for a float32 one, so x64 draws a *different* Monte-Carlo instance rather than a
# rounder copy of the same one. An assertion that survives both jobs is an assertion about an
# estimator; one that does not was reading a property of a particular draw.
#
# `test` runs the supported interpreter range; `test-x64` stays on the floor alone, because its axis
# is the dtype rather than the Python version and repeating it fourfold would buy nothing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Every supported interpreter, not the floor alone: uv.lock resolves a newer numpy from Python
    # 3.12, whose stubs type some calls differently, so a floor-only job never sees what they flag.
    # ty checks each at its own version. A free-threaded build resolves as its twin with the GIL
    # does -- no marker tells the two apart -- so it adds no leg here.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: causaldyn-bench
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        # setup-uv has published no moving major/minor tags since v8.0.0, so there is no `@v9` to
        # track: the pin is the v9.0.0 release commit itself.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        # `notebooks` too: ty checks the leaderboard notebook, which imports matplotlib
        run: uv sync --group dev --group notebooks
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check --python-version ${{ matrix.python-version }}

  # The free-threaded legs leave out polars, whose runtime is abi3 and publishes no free-threaded
  # wheel, since uv.lock cannot: PEP 508 has no marker for the build. Its test skips without it, and
  # `--no-sync` keeps `uv run` from installing it again.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.14t"
            without: --no-install-package polars --no-install-package polars-runtime-32
          - python-version: "3.15t"
            without: --no-install-package polars --no-install-package polars-runtime-32
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: causaldyn-bench
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --group dev ${{ matrix.without }}
      - name: Tests
        run: uv run --no-sync pytest

  test-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: causaldyn-bench
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests at float64
        run: uv run pytest
        env:
          JAX_ENABLE_X64: "1"

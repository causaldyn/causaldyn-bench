name: ci

# Every job checks the two repositories out side by side, because `[tool.uv.sources]` resolves
# `causal-hybrid-control` from the sibling path `../causal-hybrid-control`. The library repo is public,
# so the default `GITHUB_TOKEN` reaches it and no extra secret is involved. `uv run ruff` takes the
# version from this repo's lockfile, so CI and a local run cannot disagree about what counts as
# formatted.
#
# `test` runs at JAX's default float32; `test-x64` re-runs the same suite under `JAX_ENABLE_X64=1`.
# Two independent things make the second job worth its minutes. Track J's claim is *exact* recovery of
# a known control channel, which is a float64 claim -- at float32 its assertions relax to a measured
# noise floor, so only this job gates the seven digits. And a `seed` identifies a synthetic dataset
# only at a fixed dtype: `jax.random` spends a different number of threefry bits per element for a
# float64 output than for a float32 one, so x64 draws a *different* Monte-Carlo instance rather than a
# rounder copy of the same one. An assertion that survives both jobs is an assertion about an
# estimator; one that does not was reading a property of a particular draw.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v7
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v7
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        # Pinned to a full version, not `@v9`: setup-uv dropped its moving major/minor tags in
        # v8.0.0, so `@v9` does not resolve. The other actions here still publish them.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v7
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v7
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest

  test-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v7
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v7
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests at float64
        run: uv run pytest
        env:
          JAX_ENABLE_X64: "1"

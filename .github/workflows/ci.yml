name: ci

# Both jobs check the two repositories out side by side, because `[tool.uv.sources]` resolves
# `causal-hybrid-control` from the sibling path `../causal-hybrid-control`. The library repo is public,
# so the default `GITHUB_TOKEN` reaches it and no extra secret is involved. `uv run ruff` takes the
# version from this repo's lockfile, so CI and a local run cannot disagree about what counts as
# formatted.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v4
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v4
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v4
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v4
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest

name: ci

# Every job checks the two repositories out side by side, because `[tool.uv.sources]` resolves
# `causal-hybrid-control` from the sibling path `../causal-hybrid-control`. The library repo is public,
# so the default `GITHUB_TOKEN` reaches it and no extra secret is involved. `uv run ruff` takes the
# version from this repo's lockfile, so CI and a local run cannot disagree about what counts as
# formatted.
#
# `test` runs at JAX's default float32. Track J's claim is *exact* recovery of a known control channel,
# which is a float64 claim -- at float32 its assertions relax to a noise floor -- so `test-x64` re-runs
# that one file under `JAX_ENABLE_X64=1`, where the tight bounds apply. The x64 run is scoped to that
# file rather than the suite because `tests/test_marketplace.py` does not survive float64: Track H's
# `chc_realised_lift` falls from above 2.0 to 1.061, which is a separate open defect.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v4
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v4
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v4
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v4
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest

  test-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causaldyn-bench
    steps:
      - uses: actions/checkout@v4
        with:
          path: causaldyn-bench
      - uses: actions/checkout@v4
        with:
          repository: causaldyn/causal-hybrid-control
          path: causal-hybrid-control
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Track J at float64
        run: uv run pytest tests/test_pendulum_causal.py -q
        env:
          JAX_ENABLE_X64: "1"

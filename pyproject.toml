[project]
name = "causaldyn-bench"
version = "0.0.1"
description = "A benchmark for causal, constrained, dynamical decision-making: it scores predictions and decisions, not just one-step error."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "causal-hybrid-control",
    "numpy>=1.26",
]

[project.optional-dependencies]
trees = ["causal-hybrid-control[trees]"]  # tree baselines for Track A/B
gym = [
    "gymnasium>=1.0",
]

[dependency-groups]
dev = [
    "gymnasium>=1.0",
    # `to_frame` imports its backend by name and nothing else in the package imports either, so both
    # are development-only: running the tracks, rendering the leaderboard and writing the snapshot
    # need neither. They are here so the tests can prove the two backends carry the same records.
    "pandas>=2.0",
    "polars>=1.0",
    "pytest>=8",
    "ruff>=0.6",
]
notebooks = [
    "jupyterlab>=4.0",
    "nbconvert>=7",
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.uv.sources]
causal-hybrid-control = { path = "../causal-hybrid-control", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causaldyn_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # notebook sources carry cell magics / non-import layout

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

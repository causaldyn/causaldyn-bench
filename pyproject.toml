[project]
name = "causaldyn-bench"
version = "0.1.0"
description = "A benchmark for causal, constrained, dynamical decision-making: it scores predictions and decisions, not just one-step error."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
]
dependencies = [
    "causal-hybrid-control",
    "numpy>=1.26",
]

[project.optional-dependencies]
trees = ["causal-hybrid-control[trees]"]  # tree baselines for Track A/B
gym = [
    "gymnasium>=1.0",
]
# JAX's build for an accelerator, through the library's extra of the same name, which is JAX's own.
cpu = ["causal-hybrid-control[cpu]"]
cuda13 = ["causal-hybrid-control[cuda13]"]
cuda12 = ["causal-hybrid-control[cuda12]"]
cuda13-local = ["causal-hybrid-control[cuda13-local]"]
cuda12-local = ["causal-hybrid-control[cuda12-local]"]
rocm7-local = ["causal-hybrid-control[rocm7-local]"]
tpu = ["causal-hybrid-control[tpu]"]
oneapi = ["causal-hybrid-control[oneapi]"]

[dependency-groups]
dev = [
    "gymnasium>=1.0",
    # `to_frame` imports its backend by name and nothing else in the package imports either, so both
    # are development-only: running the tracks, rendering the leaderboard and writing the snapshot
    # need neither. They are here so the tests can prove the two backends carry the same records.
    "pandas>=2.0",
    "polars>=1.0",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.61",
]
notebooks = [
    "jupyterlab>=4.0",
    "nbconvert>=7",
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.uv]
# One accelerator per environment: two plugins would both claim the device.
conflicts = [
    [
        { extra = "cuda13" },
        { extra = "cuda12" },
        { extra = "cuda13-local" },
        { extra = "cuda12-local" },
        { extra = "rocm7-local" },
        { extra = "tpu" },
        { extra = "oneapi" },
    ],
]

[tool.uv.sources]
causal-hybrid-control = { path = "../causal-hybrid-control", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causaldyn_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # notebook sources carry cell magics / non-import layout

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
# The interpreter `.python-version` pins, not the floor: ty reads the environment's stubs at this
# version, and a target below the environment reads them on a branch they were never written for.
# ci.yml's lint legs pass each interpreter's own.
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# a name chc's top level only serves with a warning is imported from its module here
filterwarnings = ["error:chc\\.\\w+ leaves the top level:DeprecationWarning"]
